name: Vérifications

on:
  push:
  pull_request:

jobs:
  site:
    name: Site (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Inclut les tests des migrations SQL (Postgres en mémoire via PGlite)
      - run: npm test
      - run: npm run build

  fonctions:
    name: Fonctions Supabase (vérification des types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
        working-directory: supabase/functions
